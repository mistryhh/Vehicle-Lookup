<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add a Vehicle</title>
  <link rel="stylesheet" href="css/style.css" />
  <script type="module" src="js/supabaseClient.js"></script>
  <script type="module" src="js/script.js"></script>
</head>
<body>
  <div id="container">
    <header>
      <h1>Add a Vehicle</h1>
      <ul class="nav">
        <li><a href="index.html">People Search</a></li>
        <li><a href="vehicle.html">Vehicle Search</a></li>
        <li><a href="add-vehicle.html">Add a Vehicle</a></li>
      </ul>
    </header>
    <main>
      <form id="vehicle-info">
        <label for="rego">Registration Number:</label>
        <input type="text" id="rego" />
        <label for="make">Make:</label>
        <input type="text" id="make" />
        <label for="model">Model:</label>
        <input type="text" id="model" />
        <label for="colour">Colour:</label>
        <input type="text" id="colour" />
        <label for="owner">Owner Name:</label>
        <input type="text" id="owner" />
        <button type="button" id="check-owner" disabled>Check Owner</button>
      </form>
      <div id="owner-results"></div>
      <div id="message-owner"></div>
      <form id="new-owner-form" style="display: none;">
        <label for="name">Full Name:</label>
        <input type="text" id="name" />
        <label for="address">Address:</label>
        <input type="text" id="address" />
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" />
        <label for="license">License Number:</label>
        <input type="text" id="license" />
        <label for="expire">License Expiry Date:</label>
        <input type="date" id="expire" />
        <button type="button" id="add-owner">Add Owner</button>
      </form>
      <div id="message-vehicle"></div>
      <button id="add-vehicle">Add Vehicle</button>
    </main>
    <aside>
      <img src="images/car.jpg" alt="Car" width="100%" />
    </aside>
    <footer>
      <p>&copy; 2025 COMP1004</p>
    </footer>
  </div>
</body>
</html>
